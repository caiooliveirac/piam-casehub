# PIAM CaseHub — three services sharing one image: web, bot, db.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-piam}
      POSTGRES_USER: ${POSTGRES_USER:-piam}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-piam}
      TZ: ${TZ:-America/Bahia}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-piam}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    # Host port 8060 (8000/8001/8050/8080 already used by other apps on the
    # shared EC2). Container still listens on 8000; Nginx proxies to 8060.
    ports:
      - "127.0.0.1:8060:8000"
    volumes:
      - uploads:/data/uploads

  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    command: python -m app.bot.runner
    volumes:
      - uploads:/data/uploads

volumes:
  pgdata:
  uploads:
