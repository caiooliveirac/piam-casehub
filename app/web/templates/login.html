{% extends "base.html" %}
{% block title %}Login — {{ app_name }}{% endblock %}
{% block content %}
<div class="max-w-sm mx-auto mt-16 bg-white rounded-xl shadow p-6">
  <h1 class="text-lg font-semibold mb-4">Acesso administrativo</h1>
  {% if error %}
  <p class="mb-3 text-sm text-rose-600 bg-rose-50 border border-rose-200 rounded px-3 py-2">{{ error }}</p>
  {% endif %}
  <form method="post" action="/login" class="space-y-3">
    <div>
      <label class="block text-sm text-slate-600 mb-1">Usuário</label>
      <input name="username" autocomplete="username" required
             class="w-full border border-slate-300 rounded px-3 py-2" />
    </div>
    <div>
      <label class="block text-sm text-slate-600 mb-1">Senha</label>
      <input name="password" type="password" autocomplete="current-password" required
             class="w-full border border-slate-300 rounded px-3 py-2" />
    </div>
    <button class="w-full bg-slate-900 text-white rounded py-2 hover:bg-slate-700">Entrar</button>
  </form>
</div>
{% endblock %}
