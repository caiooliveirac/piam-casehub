# Nginx reverse proxy for PIAM CaseHub.
# Place in /etc/nginx/sites-available/ and symlink into sites-enabled/.
# HTTPS is added by Certbot (see docs/DEPLOY.md) once DNS points here.

server {
    listen 80;
    listen [::]:80;
    server_name piam.mnrs.com.br;

    # Upload ceiling (ECG PDFs / images). Keep in sync with MAX_UPLOAD_MB.
    client_max_body_size 25M;

    location / {
        proxy_pass http://127.0.0.1:8060;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 60s;
    }

    # Static assets served by the app; cache lightly.
    location /static/ {
        proxy_pass http://127.0.0.1:8060/static/;
        expires 1h;
        add_header Cache-Control "public";
    }
}
