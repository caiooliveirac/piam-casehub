# Server block para piam.mnrs.com.br (PIAM CaseHub).
#
# Padrão da infra mnrs.com.br: DNS via Cloudflare (proxied) + TLS de origem
# com o Cloudflare Origin wildcard *.mnrs.com.br. NÃO usa Certbot/Let's Encrypt.
#
# Cert (mesmo dos outros subdomínios):
#   /home/ubuntu/samu-normas/repo/nginx/ssl/cloudflare-origin.crt
#   /home/ubuntu/samu-normas/repo/nginx/ssl/cloudflare-origin.key
#
# A app (FastAPI/Uvicorn) é publicada pelo docker-compose em 127.0.0.1:8060.
#
# Instalação (ver docs/DEPLOY.md):
#   sudo cp nginx/piam.mnrs.com.br.conf /etc/nginx/sites-available/piam.mnrs.com.br
#   sudo ln -s /etc/nginx/sites-available/piam.mnrs.com.br /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name piam.mnrs.com.br;
    # Cloudflare já força HTTPS; este redirect é defensivo.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name piam.mnrs.com.br;

    ssl_certificate     /home/ubuntu/samu-normas/repo/nginx/ssl/cloudflare-origin.crt;
    ssl_certificate_key /home/ubuntu/samu-normas/repo/nginx/ssl/cloudflare-origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Limite de upload (PDFs/imagens de ECG). Mantenha em sincronia com MAX_UPLOAD_MB.
    client_max_body_size 25m;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location / {
        proxy_pass http://127.0.0.1:8060;
        proxy_read_timeout 60s;
    }

    location /static/ {
        proxy_pass http://127.0.0.1:8060/static/;
        expires 1h;
        add_header Cache-Control "public";
    }
}
